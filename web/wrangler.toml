# BootVolume 소개 페이지 — bootvolume.oodot.top
# 배포: npx wrangler deploy --profile 8516   (이 폴더에서)
# 정적 파일 + 영상 Range 처리(src/worker.js). public/index.html 은 디자인 캔버스(Studio.dc.html)를 변환한 것.
name = "bootvolume"
compatibility_date = "2026-10-01"
main = "src/worker.js"

routes = [
  { pattern = "bootvolume.oodot.top", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/assets/*.mp4"]
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
